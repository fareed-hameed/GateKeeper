{% extends "base.html" %}

{% block title %}AEGIS{% endblock %}

{% block content %}
<div class="card">
    <div class="brand">
        <div class="brand-shield">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M32 4L8 16v16c0 14.4 10.24 27.84 24 32 13.76-4.16 24-17.6 24-32V16L32 4z"
                      stroke="url(#sg)" stroke-width="2" fill="rgba(56,189,248,0.05)"/>
                <path d="M32 20v12m0 4v2" stroke="url(#sg)" stroke-width="3" stroke-linecap="round"/>
                <circle cx="32" cy="40" r="2" fill="#38bdf8"/>
                <defs><linearGradient id="sg" x1="8" y1="4" x2="56" y2="52">
                    <stop stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/>
                </linearGradient></defs>
            </svg>
        </div>
        <h1>AEGIS</h1>
        <p class="brand-full">Advanced Engine for Guardian Intelligence &amp; Security</p>
    </div>

    <div class="scanner-line"></div>

    <div id="codeSection">
        <p class="subtitle" data-t="enter_code">Enter your access code</p>
        <form id="codeForm" autocomplete="off">
            <div class="code-input-group">
                <div style="position:relative;">
                    <input type="text" id="codeInput" inputmode="numeric" pattern="[0-9]*"
                           maxlength="8" placeholder="------" autofocus>
                    <button type="button" id="clearBtn" class="clear-btn hidden" aria-label="Clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg></button>
                </div>
            </div>
            <button type="submit" id="submitBtn" disabled data-t="trigger">Open Gate</button>
        </form>
    </div>

    <div id="bypassSection" class="hidden">
        <p class="subtitle"><span data-t="trusted_device">Registered device detected</span> <span class="bypass-badge" data-t="trusted">Trusted</span></p>
        <button id="bypassBtn" class="btn-bypass" disabled data-t="trigger">Open Gate</button>
        <a href="/admin" class="btn btn-secondary" style="display:block;margin-top:.5rem;text-align:center;text-decoration:none;" data-t="command_center">Command Center</a>
    </div>

    <div id="statusRing" class="status-ring hidden">
        <span class="icon" id="statusIcon"></span>
    </div>
    <div id="status" class="status hidden"></div>
    <div id="info" class="info hidden"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
// All 5 languages on gate page
renderLangSelector('langBar', ['en','ar','ur','hi','bn']);

const form = document.getElementById('codeForm');
const input = document.getElementById('codeInput');
const btn = document.getElementById('submitBtn');
const bypassBtn = document.getElementById('bypassBtn');
const codeSection = document.getElementById('codeSection');
const bypassSection = document.getElementById('bypassSection');
const status = document.getElementById('status');
const statusRing = document.getElementById('statusRing');
const statusIcon = document.getElementById('statusIcon');
const info = document.getElementById('info');
const clearBtn = document.getElementById('clearBtn');

// Pre-fill code from URL query param (e.g. ?code=123456)
const urlCode = new URLSearchParams(window.location.search).get('code');
if (urlCode) {
    input.value = urlCode.replace(/\D/g, '').slice(0, 8);
    clearBtn.classList.toggle('hidden', input.value.length === 0);
}

input.addEventListener('input', () => {
    clearBtn.classList.toggle('hidden', input.value.length === 0);
});
clearBtn.addEventListener('click', () => {
    input.value = '';
    clearBtn.classList.add('hidden');
    input.focus();
});

function applyTranslations() {
    document.querySelectorAll('[data-t]').forEach(el => {
        const key = el.getAttribute('data-t');
        if (el.tagName === 'INPUT') el.placeholder = t(key);
        else el.textContent = t(key);
    });
    renderLangSelector('langBar', ['en','ar','ur','hi','bn']);
}
applyTranslations();

function onFingerprintReady() {
    btn.disabled = false;
    bypassBtn.disabled = false;
    checkBypass();
}
if (window.gkFingerprint) { btn.disabled = false; bypassBtn.disabled = false; checkBypass(); }

async function checkBypass() {
    try {
        const resp = await fetch('/api/admin/check', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({fingerprint: window.gkFingerprint, signature: window.gkSignature})
        });
        const data = await resp.json();
        if (data.enrolled) {
            codeSection.classList.add('hidden');
            bypassSection.classList.remove('hidden');
        }
    } catch(e) {}
}

async function triggerAction(code) {
    status.className = 'status hidden';
    info.className = 'info hidden';
    statusRing.className = 'status-ring';
    statusRing.classList.remove('hidden');
    statusIcon.innerHTML = '';

    try {
        const body = {fingerprint: window.gkFingerprint, signature: window.gkSignature};
        if (code !== null) body.code = code;
        const resp = await fetch(code !== null ? '/api/trigger' : '/api/bypass', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        });
        const data = await resp.json();

        if (data.ok) {
            statusRing.classList.add('success');
            statusIcon.innerHTML = '<svg viewBox="0 0 40 40" width="40" height="40"><path d="M10 20l7 7 13-13" stroke="#34d399" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';
            status.textContent = t('access_granted');
            status.className = 'status success';
        } else {
            statusRing.classList.add('error');
            statusIcon.innerHTML = '<svg viewBox="0 0 40 40" width="40" height="40"><path d="M12 12l16 16M28 12l-16 16" stroke="#f87171" stroke-width="4.5" stroke-linecap="round" fill="none"/></svg>';
            status.textContent = t(data.error === 'Invalid code' ? 'invalid_code' : data.error === 'Daily limit reached' ? 'daily_limit' : data.error === 'Access window has expired' ? 'window_expired' : 'access_denied');
            status.className = 'status error';
        }

        const parts = [];
        if (data.remaining_attempts !== undefined) {
            parts.push(t('attempts_remaining', {n: data.remaining_attempts, s: data.remaining_attempts !== 1 ? 's' : ''}));
        }
        if (data.cooldown_seconds) {
            _lastCooldown = data.cooldown_seconds;
            if (data.ok) parts.push(`${data.cooldown_seconds}s cooldown`);
        }
        if (data.window_seconds_left !== undefined && data.window_seconds_left !== null) {
            const mins = Math.ceil(data.window_seconds_left / 60);
            if (mins > 0) parts.push(t('window_remaining', {n: mins}));
        }
        if (parts.length) {
            info.textContent = parts.join(' \u00b7 ');
            info.className = 'info';
        }
    } catch (err) {
        statusRing.classList.add('error');
        statusIcon.innerHTML = '<svg viewBox="0 0 40 40" width="40" height="40"><path d="M20 10v14" stroke="#f87171" stroke-width="4.5" stroke-linecap="round" fill="none"/><circle cx="20" cy="30" r="2.5" fill="#f87171"/></svg>';
        status.textContent = t('network_error');
        status.className = 'status error';
    }
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = input.value.trim();
    if (!code || !window.gkFingerprint) return;
    btn.disabled = true;
    btn.textContent = t('authenticating');
    await triggerAction(code);
    input.blur();

    const isOk = status.classList.contains('success');
    if (isOk) {
        let cd = _lastCooldown;
        const tick = () => {
            if (cd > 0) { btn.textContent = `${cd}s`; btn.disabled = true; cd--; setTimeout(tick, 1000); }
            else { btn.disabled = false; btn.textContent = t('trigger'); }
        };
        tick();
    } else {
        btn.disabled = false;
        btn.textContent = t('trigger');
    }
});

let _lastCooldown = 30;

bypassBtn.addEventListener('click', async () => {
    bypassBtn.disabled = true;
    bypassBtn.textContent = t('authenticating');
    await triggerAction(null);

    const statusEl = document.getElementById('status');
    const isOk = statusEl && statusEl.classList.contains('success');
    if (isOk) {
        let cd = _lastCooldown;
        const tick = () => {
            if (cd > 0) {
                bypassBtn.textContent = `${cd}s`;
                bypassBtn.disabled = true;
                cd--;
                setTimeout(tick, 1000);
            } else {
                bypassBtn.disabled = false;
                bypassBtn.textContent = t('trigger');
            }
        };
        tick();
    } else {
        bypassBtn.disabled = false;
        bypassBtn.textContent = t('trigger');
    }
});
</script>
{% endblock %}
